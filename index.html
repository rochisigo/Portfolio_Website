<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Rodrigo Arenas — robotics software and computer vision portfolio."
    />
    <title>Rodrigo Arenas</title>

    <!-- Tab icon, and the icon iPhones use when the site is added to the home screen. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Link preview (Open Graph): what LinkedIn, Slack, iMessage etc. show when
         the link is pasted. Their bots don't run JavaScript, so these must live
         here in plain HTML, and og:image must be a full https:// URL. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://rochisigo.github.io/Portfolio_Website/" />
    <meta property="og:title" content="Rodrigo Arenas · Robotics Software & Computer Vision" />
    <meta
      property="og:description"
      content="I build perception, autonomy, and simulation software for robots."
    />
    <meta
      property="og:image"
      content="https://rochisigo.github.io/Portfolio_Website/og-image.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Rodrigo Arenas, CS senior at UW–Madison and autonomy lead at Wisconsin Robotics" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
